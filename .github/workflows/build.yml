name: Windows build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.100.0-x86_64-pc-windows-gnu
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-toolchain
      - name: Configure compiler
        shell: pwsh
        env:
          MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          (Join-Path $env:MSYS_ROOT 'mingw64/bin') | Out-File -FilePath $env:GITHUB_PATH -Append
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust install failed' }
      - name: Format and tests
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build release
        shell: pwsh
        run: ./build.ps1
      - name: Verify all 24 voices offline
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/bin/Vesper.exe -ArgumentList '--self-test','--output-dir=dist/checks' -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Offline DSP verification failed' }
          $passes = @(Select-String -LiteralPath dist/checks/verification.txt -Pattern '^PASS ')
          if ($passes.Count -ne 24) { throw 'Expected 24 verified presets' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vesper-windows-x64
          path: dist/bin/Vesper.exe
          if-no-files-found: error
