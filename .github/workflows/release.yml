name: Draft GitHub release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.100.0-x86_64-pc-windows-gnu
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-toolchain
      - name: Configure and validate version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          (Join-Path $env:MSYS_ROOT 'mingw64/bin') | Out-File -FilePath $env:GITHUB_PATH -Append
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match Cargo.toml version' }
          "VESPER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust install failed' }
      - name: Verify and package
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          ./scripts/Write-ThirdPartyNotices.ps1
          ./scripts/New-Release.ps1
          ./scripts/Test-Release.ps1
      - name: Smoke-test installer without changing audio drivers
        shell: pwsh
        run: |
          $setup = "dist/release/$env:VESPER_VERSION/Vesper-$env:VESPER_VERSION-Setup-x64.exe"
          $destination = Join-Path $env:RUNNER_TEMP 'Vesper-package-test'
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/NORESTART','/CURRENTUSER','/NOICONS','/TASKS="!vbcable,!desktopicon"',("/DIR=`"$destination`""),'/LOG=dist/installer-test.log' -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if ((Get-FileHash "$destination/Vesper.exe").Hash -ne (Get-FileHash dist/bin/Vesper.exe).Hash) { throw 'Installed binary differs' }
          $process = Start-Process -FilePath "$destination/Vesper.exe" -ArgumentList '--self-test','--output-dir=dist/checks' -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Installed binary self-test failed' }
          $passes = @(Select-String -LiteralPath dist/checks/verification.txt -Pattern '^PASS ')
          if ($passes.Count -ne 24) { throw 'Expected all 24 voices' }
      - name: Create draft and attach files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not (($existing | ConvertFrom-Json).isDraft)) { throw 'Refusing to replace a published release' }
          } else {
            gh release create $env:RELEASE_TAG --draft --verify-tag --title "VESPER $env:VESPER_VERSION" --notes-file .github/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft' }
          }
          $files = @(Get-ChildItem "dist/release/$env:VESPER_VERSION" -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
