[package]
name = "vesper"
version = "1.2.0"
edition = "2021"
description = "Vesper — lightweight native voice studio"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["voice-changer", "audio", "dsp", "windows", "egui"]
categories = ["multimedia::audio"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow"] }
cpal = "0.15.3"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false }
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Devices_Properties", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
